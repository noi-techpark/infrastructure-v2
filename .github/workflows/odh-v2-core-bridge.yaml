name: CI/CD odh-v2-core-bridge

on: 
  push:
    paths:
      - "infrastructure/raw-data-bridge/**"      
      - "infrastructure/helm/raw-data-bridge/**"
      - "deploy/values/raw-data-bridge/**"
      - ".github/workflows/odh-v2-core-bridge.yaml"
  workflow_dispatch:

env:
  WORKING_DIRECTORY: infrastructure/raw-data-bridge
  KUBERNETES_NAMESPACE: core
  KUBERNETES_VALUE_PATH: deploy/values/raw-data-bridge/values.yaml
  KUBERNETES_CHART_PATH: infrastructure/helm/raw-data-bridge
  PROJECT_NAME: raw-data-bridge

jobs:
  # Runs on every push, including branches that never deploy. The suite needs a
  # MongoDB: without one the integration tests skip, which is the same as not
  # having them.
  test:
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # Without a health check the job starts as soon as the container does,
        # not as soon as mongod accepts connections, and the suite races it.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: infrastructure/raw-data-bridge/go.mod

    - name: Test
      run: go test ./... -count=1
      working-directory: ${{ env.WORKING_DIRECTORY }}
      env:
        # 127.0.0.1, not localhost: the service is published on IPv4 only, and
        # a runner that resolves localhost to ::1 spends the driver's whole
        # server-selection timeout failing before the tests even start.
        RDB_TEST_MONGO_URI: mongodb://127.0.0.1:27017

  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'
    needs:
      - test
    runs-on: ubuntu-22.04
    concurrency: odh-v2-core-bridge-build
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Log in to GitHub Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Manually build and push image
      run: cd ${{ env.WORKING_DIRECTORY }} && ./build.sh

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'
    needs: 
      - build
    runs-on: ubuntu-22.04
    concurrency: odh-v2-core-bridge-build-deploy
    environment: ${{ github.ref == 'refs/heads/main' && 'test' || github.ref == 'refs/heads/prod' && 'prod' || 'unknown' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: ${{ env.PROJECT_NAME }}
          k8s-namespace: ${{ env.KUBERNETES_NAMESPACE }}
          chart-path: ${{ env.KUBERNETES_CHART_PATH }}
          values-file: ${{ env.KUBERNETES_VALUE_PATH }}
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
