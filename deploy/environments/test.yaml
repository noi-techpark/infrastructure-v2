# Non-secret per-environment settings. Merged with secrets/test.yaml into one set
# of values; secrets never go here.

certManager:
  email: digital@noi.bz.it
  namespaces: [core, collector, monitoring, parking, pt]
  # DNS01 solver for the letsencrypt-dns-* cluster issuers, in the Scaleway zone
  # scw.opendatahub.testingmachine.eu. Credentials come from the webhook's environment.
  dns01:
    webhook:
      groupName: acme.scaleway.com
      solverName: scaleway

objectStorage:
  region: fr-par
  endpoint: https://s3.fr-par.scw.cloud

velero:
  bucket: opendatahub-test-velero

# Hosts reach the cluster through the proxy (Caddy, TLS), which forwards to the ingress
# load balancer over plain HTTP, as on AWS.
ingress:
  # Terraform kubernetes output ingress_lb_id. The load balancer and its IP belong to
  # Terraform and outlive the cluster; the controller only configures it. Empty: the
  # controller creates its own load balancer, deleted with the cluster.
  lbId: "fr-par-1/754663ca-e851-4115-91e4-4339ca019abc"
  # Published as the address of every Ingress, so external-dns points hosts at the proxy.
  proxy: "proxy-opendatahub-test.scw.opendatahub.testingmachine.eu"

# external-dns: the zone it writes to and the name marking its own records.
dns:
  zone: scw.opendatahub.testingmachine.eu
  ownerId: "opendatahub-test"

oauthCollector:
  authorizationUri: https://auth.opendatahub.testingmachine.eu/auth
  tokenUri: https://auth.opendatahub.testingmachine.eu/auth/realms/noi/protocol/openid-connect/token
  clientId: odh-mobility-datacollector

imageTags:
  rawWriter2: latest
