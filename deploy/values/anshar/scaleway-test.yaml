# TLS ends at the proxy (proxy-opendatahub-test); the ingress serves plain HTTP behind it.
# For TLS in the cluster as well, swap in the commented lines and point the proxy site at
# https. Only the DNS01 cluster issuer works here: HTTP01 challenges would reach the proxy.
ingress:
  annotations:
    cert-manager.io/issuer: null
    # cert-manager.io/cluster-issuer: letsencrypt-dns-prod
  hosts:
    - host: siri.api.scw.opendatahub.testingmachine.eu
      paths:
        - path: /v1(/|$)(.*)
          pathType: ImplementationSpecific
  tls: []
