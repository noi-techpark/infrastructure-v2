# On AWS an external proxy terminated TLS for this API; here the ingress does it.
ingress:
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
  hosts:
    - host: mobility.share.scw.opendatahub.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - secretName: tls-bdp-core
      hosts:
        - mobility.share.scw.opendatahub.testingmachine.eu
