# Ships the container logs of every pod to OpenSearch (retention-<class>-YYYY.MM.DD) and to
# Loki ({job="kubernetes", log_retention="<class>"}), the same lines to both. The class comes
# from the pod label log-retention (10d, 30d or 90d), 30d when missing or unknown; OpenSearch
# ISM policies and Loki's retention_stream delete by class (infrastructure repo,
# terraform/scaleway/digital/opensearch/ism.tf and ansible/files/loki-scw/config.yaml).
# Hosts and the cluster name come from scaleway-<env>.yaml, passwords from the fluent-bit
# secret rendered by cluster-secrets.

envFrom:
  - secretRef:
      name: fluent-bit

# Every node, whatever its taints: a node without the DaemonSet loses its logs.
tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: true

# Kapsule runs containerd: /var/log/containers links to /var/log/pods, both under /var/log.
# /var/lib/fluent-bit keeps the read positions and the chunk buffer across pod restarts.
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: state
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: state
    mountPath: /var/lib/fluent-bit
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

luaScripts:
  retention.lua: |
    -- Retention class from the pod label log-retention; anything else gets the default.
    -- The pod labels are dropped afterwards, as on AWS: each one would be a field in
    -- OpenSearch.
    local classes = { ["10d"] = true, ["30d"] = true, ["90d"] = true }

    function retention(tag, timestamp, record)
      local class = "30d"
      local k8s = record["kubernetes"]
      if type(k8s) == "table" then
        local labels = k8s["labels"]
        if type(labels) == "table" and classes[labels["log-retention"]] then
          class = labels["log-retention"]
        end
        k8s["labels"] = nil
      end
      record["log_retention"] = class
      record["log_index"] = "retention-" .. class
      return 2, timestamp, record
    end

  stringify.lua: |
    -- Fields that apps log sometimes as text, sometimes as number or object (e.g. MongoDB's
    -- attr.user). OpenSearch maps a field by the first value of the day and rejects the other
    -- kind, so these are always sent as text; objects as JSON. Same list as Filebeat on AWS,
    -- plus id and attr.error.
    local fields = { {"id"}, {"error"}, {"station"}, {"attr", "user"}, {"attr", "error"} }

    local function encode(v)
      local t = type(v)
      if t == "table" then
        local parts = {}
        if next(v) == nil or #v > 0 then
          for i, x in ipairs(v) do parts[i] = encode(x) end
          return "[" .. table.concat(parts, ",") .. "]"
        end
        for k, x in pairs(v) do parts[#parts + 1] = encode(tostring(k)) .. ":" .. encode(x) end
        return "{" .. table.concat(parts, ",") .. "}"
      elseif t == "string" then
        return '"' .. v:gsub('[%c"\\]', function(c)
          return string.format("\\u%04x", c:byte())
        end) .. '"'
      end
      return tostring(v)
    end

    function stringify(tag, timestamp, record)
      local json = record["json"]
      if type(json) ~= "table" then
        return 0, timestamp, record
      end
      local changed = false
      for _, path in ipairs(fields) do
        local parent = json
        for i = 1, #path - 1 do
          parent = type(parent) == "table" and parent[path[i]] or nil
        end
        local key = path[#path]
        if type(parent) == "table" and parent[key] ~= nil and type(parent[key]) ~= "string" then
          local v = parent[key]
          parent[key] = type(v) == "table" and encode(v) or tostring(v)
          changed = true
        end
      end
      return changed and 2 or 0, timestamp, record
    end

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On
        # Buffers chunks on disk, so a restart or an unreachable output does not lose logs.
        storage.path /var/lib/fluent-bit/storage

  inputs: |
    [INPUT]
        Name tail
        Tag kube.*
        Path /var/log/containers/*.log
        multiline.parser cri
        # Read position per file, so a restart neither skips nor repeats lines.
        DB /var/lib/fluent-bit/kube-tail.db
        storage.type filesystem
        Skip_Long_Lines On

  filters: |
    # JSON log lines are parsed into the field json, as Filebeat did on AWS, so application
    # fields cannot collide with the metadata.
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Merge_Log_Key json
        Keep_Log Off
        Labels On
        Annotations Off
        # Pod metadata from the API server; the default 32k is too small for pods with large
        # annotations, whose lines then ship without kubernetes fields ("cannot increase buffer").
        Buffer_Size 512k
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name lua
        Match kube.*
        script /fluent-bit/scripts/retention.lua
        call retention

    [FILTER]
        Name lua
        Match kube.*
        script /fluent-bit/scripts/stringify.lua
        call stringify

    [FILTER]
        Name modify
        Match kube.*
        Add cluster ${CLUSTER}

  outputs: |
    [OUTPUT]
        Name opensearch
        Match kube.*
        Host ${OPENSEARCH_HOST}
        Port 9200
        tls On
        tls.verify On
        HTTP_User fluentbit
        HTTP_Passwd ${OPENSEARCH_PASSWORD}
        Logstash_Format On
        Logstash_Prefix_Key $log_index
        Suppress_Type_Name On
        Replace_Dots On
        Trace_Error On
        # Finite, unlike Loki: a record OpenSearch rejects (mapping conflict) fails on every
        # retry and would otherwise stay in the buffer forever. 15 retries span a few hours
        # of outage; Loki keeps every line regardless.
        Retry_Limit 15
        storage.total_limit_size 1G

    # Pod names stay out of the labels: every pod would be a new stream.
    [OUTPUT]
        Name loki
        Match kube.*
        Host ${LOKI_HOST}
        Port 443
        tls On
        tls.verify On
        HTTP_User fluentbit
        HTTP_Passwd ${LOKI_PASSWORD}
        Labels job=kubernetes, cluster=${CLUSTER}, namespace=$kubernetes['namespace_name'], container=$kubernetes['container_name'], log_retention=$log_retention
        Remove_Keys log_index
        Line_Format json
        Retry_Limit no_limits
        storage.total_limit_size 1G
