# On AWS an external proxy terminated TLS for this API; here the ingress does it.
ingress:
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
  hosts:
    - host: mobility.api.scw.opendatahub.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix
    - host: timeseries.api.scw.opendatahub.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - secretName: tls-ninja-api
      hosts:
        - mobility.api.scw.opendatahub.testingmachine.eu
        - timeseries.api.scw.opendatahub.testingmachine.eu
