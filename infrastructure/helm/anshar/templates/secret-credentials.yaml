{{- $secretName := printf "%s-credentials" (include "anshar.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $ansharPassword := randAlphaNum 32 }}
{{- $springPassword := randAlphaNum 32 }}
{{- if $existing }}
{{- $ansharPassword = index $existing.data "anshar-password" | b64dec }}
{{- $springPassword = index $existing.data "spring-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "anshar.labels" . | nindent 4 }}
type: Opaque
stringData:
  anshar-username: "admin"
  anshar-password: {{ $ansharPassword | quote }}
  spring-username: "admin"
  spring-password: {{ $springPassword | quote }}
